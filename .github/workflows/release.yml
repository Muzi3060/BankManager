name: Build and release

# Branches e PRs validam o projeto; tags v* também acionam a publicação da release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Somente o job de release recebe permissão de escrita; os demais precisam apenas ler o código.
permissions:
  contents: read

jobs:
  package:
    name: Test and package (${{ matrix.runtime }})
    # Falhas em um sistema não cancelam o outro, preservando o diagnóstico dos dois destinos.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Impede publicar uma tag cujo número diverge da versão declarada no aplicativo.
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          version = ET.parse('BankManager/BankManager.csproj').findtext('./PropertyGroup/Version')
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match csproj Version'
      - name: Build
        run: dotnet build BankManager.sln -c Release -m:1 --disable-build-servers
      - name: Domain and persistence tests
        run: dotnet run --project BankManager.Tests -c Release --no-build
      # No runner Linux, Xvfb fornece o display para os testes de janela real.
      - name: UI integration tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1
          xvfb-run -a dotnet run --project BankManager.UiTests -c Release --no-build
      - name: Publish and archive
        run: python scripts/package.py --runtime ${{ matrix.runtime }}
      # Artifacts ficam disponíveis também em builds comuns; dados pessoais nunca entram no pacote.
      - uses: actions/upload-artifact@v4
        with:
          name: BankManager-${{ matrix.runtime }}
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 14

  # Publica somente tags e somente após todos os destinos terminarem com sucesso.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # O token temporário do GitHub é passado via ambiente, sem ser gravado no repositório.
      - name: Publish portable packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --title "BankManager $GITHUB_REF_NAME"
          --notes-file docs/RELEASE-NOTES.md
