name: Compilar e publicar

# Branches e PRs validam o projeto; tags v* também acionam a publicação da release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Somente o job de release recebe permissão de escrita; os demais precisam apenas ler o código.
permissions:
  contents: read

jobs:
  package:
    name: Testar e empacotar (${{ matrix.runtime }})
    # Falhas em um sistema não cancelam o outro, preservando o diagnóstico dos dois destinos.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Impede publicar uma tag cujo número diverge da versão declarada no aplicativo.
      - name: Conferir a versão da release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          version = ET.parse('codigo/BankManager/BankManager.csproj').findtext('./PropertyGroup/Version')
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match csproj Version'
      - name: Compilar
        run: dotnet build BankManager.sln -c Release -m:1 --disable-build-servers
      - name: Testes de domínio e persistência
        run: dotnet run --project testes/BankManager.Testes -c Release --no-build
      # No runner Linux, Xvfb fornece o display para os testes de janela real.
      - name: Testes de interface (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1
          xvfb-run -a dotnet run --project testes/BankManager.TestesDeInterface -c Release --no-build
      # No Windows o runner tem sessão gráfica, então a janela real abre sem Xvfb. Este passo ainda não foi validado em um
      # Windows de verdade: enquanto não tiver ficado verde algumas vezes, uma falha aparece como aviso, sem bloquear a release.
      # Depois de confirmado, remova a linha continue-on-error.
      - name: Testes de interface (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: dotnet run --project testes/BankManager.TestesDeInterface -c Release --no-build
      - name: Publicar e compactar
        run: python scripts/empacotar.py --runtime ${{ matrix.runtime }}
      # ---- Windows: instalador (Inno Setup). Instala por usuário, sem administrador, e atualiza por cima da versão anterior. ----
      - name: Instalar o Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Instalador do Windows
        if: runner.os == 'Windows'
        run: python scripts/instaladores.py windows
      # Instala em silêncio numa pasta temporária, confere o executável e desinstala. Também ainda não validado em um Windows
      # real: um erro aqui aparece como aviso até o passo ser confirmado.
      - name: Teste rápido do instalador (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/releases -Filter '*-setup.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'bm-install'
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\BankManager.exe")) { throw 'O executável não foi instalado' }
          $uninstaller = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (Test-Path "$dir\BankManager.exe") { throw 'A desinstalação deixou o executável' }
      # ---- Linux: AppImage com informação de atualização (zsync). O appimagetool é baixado em versão fixa, com checksum conferido. ----
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: python scripts/instaladores.py appimage
      # O AppImage precisa abrir de verdade: rodando sob Xvfb por 10 segundos, "continuar vivo até o timeout" (código 124) é sucesso.
      - name: Teste rápido do AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          chmod +x artifacts/releases/BankManager-*-x86_64.AppImage
          BANKMANAGER_DATA_DIR="$(mktemp -d)" xvfb-run -a timeout 10 artifacts/releases/BankManager-*-x86_64.AppImage --appimage-extract-and-run
          code=$?
          test "$code" = 124 || { echo "O AppImage encerrou com código $code"; exit 1; }
          test -f artifacts/releases/BankManager-*-x86_64.AppImage.zsync
      # Artifacts ficam disponíveis também em builds comuns; dados pessoais nunca entram no pacote.
      - uses: actions/upload-artifact@v4
        with:
          name: BankManager-${{ matrix.runtime }}
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 14

  # Publica somente tags e somente após todos os destinos terminarem com sucesso.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # O token temporário do GitHub é passado via ambiente, sem ser gravado no repositório.
      - name: Publicar pacotes e instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag --title "BankManager $GITHUB_REF_NAME"
          --notes-file docs/RELEASE-NOTES.md
